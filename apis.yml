aid: convelio
name: Convelio
description: 'Convelio is a Paris- and London-based tech-enabled fine art logistics
  company that moves high-value, fragile and oversized objects — paintings, sculpture,
  antiques and design — for galleries, auction houses, art fairs, dealers, collectors
  and online marketplaces. Its differentiator is an instant-pricing engine that returns
  an all-inclusive door-to-door shipping price (packing, crating, customs, road/air/sea
  freight, insurance and white-glove delivery) in place of the multi-day manual quoting
  the art-handling trade traditionally runs on. Convelio exposes that engine to partners
  as the Convelio Public API — a REST Shipping API (v2.0) documented with OpenAPI 3.1
  at developers.convelio.com — plus an embeddable checkout widget, a web dashboard and
  a tracking surface, so marketplaces and auction platforms can price, book and track
  fine art shipments inside their own product.'
