- id: rfc7807-problem-details
  conforms: partial
  evidence: >-
    The http-error schema explicitly cites IETF RFC 7807 and uses the type/title/status/
    detail shape, but every error response declares content type application/json rather
    than application/problem+json, and `type` is a generic W3C status-code URL rather
    than a Convelio-owned problem-type identifier.
- id: rfc9457-problem-details
