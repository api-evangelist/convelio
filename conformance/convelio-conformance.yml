summary: >-
  Convelio's conformance posture is narrow but honest: a valid OpenAPI 3.1.0 contract, an
  RFC 7807-shaped error body, ISO 3166-1 alpha-2 country codes, and HMAC-SHA256 webhook
  signing. It asserts no industry standard beyond that, and — importantly — publishes no
  security or compliance certifications at all. No trust centre, no SOC 2 / ISO 27001 /
  PCI claim, no security.txt, no vulnerability-disclosure policy. For a company that
  takes custody of high-value insured objects and processes payment for them, the absence
  of a published compliance surface is the notable finding.
standards:
