  authentication: authentication/convelio-authentication.yml
  errors: errors/convelio-problem-types.yml
  lifecycle: lifecycle/convelio-lifecycle.yml
  sandbox: sandbox/convelio-sandbox.yml
  webhooks: asyncapi/convelio-webhooks.yml
