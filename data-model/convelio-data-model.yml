source: openapi/convelio-shipping-openapi.yml
summary: >-
  The Convelio data model is a two-object commercial spine — Quote then Order — hanging
  off a shared shipment description. A shipment is expressed as one or more Pickups
  (each an address, contacts and the Items collected there) travelling to a single
  Delivery. Both Quote and Order embed that same shipment description plus a Price;
  Order additionally carries BillingDetails and is created from a quote_id, which is the
  only id-reference relationship in the whole API. There is no customer, account, user,
  invoice or document entity — the model stops at the shipment.
root_entities:
- name: quote
  created_by: createShippingQuote
  read_by: getShippingQuote
  identifier: {field: id, type: string, format: uuid}
  status_field: status
  statuses:
  - {value: created, meaning: 'The API successfully returned an instant shipping price and the quote has been created in Convelio''s system'}
  - {value: processing, meaning: 'The API could not return an instant shipping price (geography, over-sized item, high commercial value) and Convelio''s Operational team is working on providing a Custom Quote within 24h'}
- name: order
  created_by: createShippingOrder
  read_by: null
  identifier: {field: id, type: string, format: uuid}
  note: >-
    Write-only from the API's point of view — there is no getOrder / listOrders
    operation. Once created, an order is observable only through the
    shipment_status_changed and document_ready webhooks and the web dashboard.
- name: webhook
  created_by: createWebhook
  read_by: [getWebhook, listWebhooks]
  identifier: {field: id, type: string, format: uuid}
