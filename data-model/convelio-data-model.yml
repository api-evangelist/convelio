identifiers:
  scheme: UUID v4, no type prefix
  note: >-
    Unlike prefix-encoded id schemes (Stripe's `cus_`/`ch_`), Convelio ids are bare
    UUIDs, so an id string carries no type information — quote_id and order_id are
    indistinguishable by inspection.
gaps:
- No customer/account entity — the API is scoped entirely by the API key.
- No read path for orders (no getOrder, no listOrders) and no list path for quotes.
- No document entity, despite a document_ready webhook that announces one.
- Shipment status lives only on webhook payloads; it is not readable on any resource.
