format: rfc7807
format_note: >-
  Convelio's own schema description cites IETF RFC 7807 (Problem Details for HTTP APIs,
  now obsoleted by RFC 9457) and states the error model follows the
  application/problem+json content type. NOTE THE DIVERGENCE: every error response in
  the OpenAPI document actually declares content type application/json, not
  application/problem+json. The BODY shape is problem+json (type/title/status/detail);
  the advertised media type is not. Recorded as-published, not corrected.
envelope:
  schema: http-error
  fields:
  - {name: type, type: string, description: URL to a page with more detail about the problem — the primary identifier for the problem}
  - {name: title, type: string, description: Short human-readable summary of the problem}
  - {name: status, type: integer, description: HTTP status code}
  - {name: detail, type: string, description: Human-readable explanation specific to this occurrence}
  type_uri_note: >-
    The documented example `type` value is the generic W3C RFC 2616 section-10 status
    code page (http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html), not a
    Convelio-owned problem-type URI. Convelio therefore publishes no per-problem type
    registry — a client cannot branch on `type` to distinguish two 422s.
validation_extension:
  schema: http-unprocessable-entity-error
  extends: http-error
  field: validation_messages
  shape: '{field_name}: {error_title}: <message>'
  description: >-
    Returned only on 422 when a request body is present and invalid. A map keyed by the
    offending field name, whose value is a map keyed by an error title. Example
    published by Convelio: delivery_type -> deliveryTypeInvalid -> "Invalid delivery
    type. Valid values are: curbside, white_glove".
