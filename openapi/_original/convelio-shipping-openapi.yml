    address:
      title: Address
      x-tags:
      - Models
      type: object
      properties:
        street:
          type: string
          maxLength: 255
          description: Address's street.
          example: 42 rue des allees
        city:
          type: string
          maxLength: 255
          example: Paris
          description: Address's city.
        state:
          type: string
          maxLength: 255
          example: Ile-de-france
          description: Address's state.
        postcode:
          type: string
          maxLength: 255
          example: '75004'
          description: Address's postcode.
        country_code:
          $ref: '#/components/schemas/country-code'
      required:
      - country_code
    phone:
      title: Phone
      type: string
      maxLength: 255
      examples:
      - '+442033188673'
      - +44 2 033 188 673
      - +44 20 33 18 86 73
      - 44;2033188673;gb
      description: "Phone number with following formats:\n\n- **International E.164 formats**:<br>\n  Example: `+33123123123`\
        \ or `+33 1 23 12 31 23`\n  - `+33`: Country code with a `+` prefix\n  - `123123123`: Local phone number\n\n  Spaces\
        \ between digits are supported, but cleaned on our side.<br><br>\n\n- **Format with country code, local number, and\
        \ country ISO2 code**:<br>\n   Example: `33;12312313;fr`\n     - `33`: Country code (international dialing code)\n\
        \     - `12312313`: Local phone number\n     - `fr`: Country `ISO 3166-1 alpha-2` code (France in this example)\n\n\
        \   The parts are separated by semicolons (`;`)."
    contact:
      title: Contact
      x-tags:
      - Models
      type: object
      description: ''
      properties:
        first_name:
          type: string
          maxLength: 255
          example: John
          description: Contact's first name.
        last_name:
          type: string
          maxLength: 255
          example: Doe
          description: Contact's last name.
        email:
          type: string
          format: email
          maxLength: 255
          example: john.doe@exemple.com
          description: Contact's main email.
        phone:
          $ref: '#/components/schemas/phone'
        additional_emails:
          type: array
          description: Contact's additional email addresses.
          items:
            type: string
            format: email
        additional_phones:
          type: array
          description: Contact's additional phone numbers.
          items:
            $ref: '#/components/schemas/phone'
      required:
      - first_name
      - last_name
      - email
      - phone
    delivery:
      title: Delivery
      type: object
      description: Delivery details.
      properties:
        type:
          $ref: '#/components/schemas/delivery-type'
        address:
          $ref: '#/components/schemas/address'
        contact:
          $ref: '#/components/schemas/contact'
        company_name:
          type: string
          maxLength: 255
          description: Delivery company name.
          example: Company Name LTD
        additional_info:
          type: string
          example: Additional information regarding the delivery.
          description: Additional information regarding the delivery.
      required:
      - type
      - address
    speed-shipment-estimation:
      title: ShippingSpeedShipmentEstimation
      x-tags:
      - Enums
      description: 'Freight speed.

        Possible values:

        - regular speed: Our standard air freight speed option.'
      type: string
      enum:
      - regular_speed
      default: regular_speed
    direct-label-request:
      title: DirectLabelRequest
      x-tags:
      - Enums
      description: 'Direct label request.

        Possible values:

        - cheapest_option: API will return direct label prices if available and if direct label is the cheapest option.

        - direct_label_only: API will always consider the direct label option if available and return direct label prices
        accordingly.

        - direct_label_excluded: API will never consider the direct label option and therefore will never return direct label
        prices.'
      type: string
      enum:
      - cheapest_option
      - direct_label_only
      - direct_label_excluded
      default: cheapest_option
    contract-insurance:
      title: ContractInsurance
      description: You can add an Ad Valorem insurance that will compensate your prejudice in the event of damage, theft or
        loss (up to the declared value of your items and shipping costs, in case of total loss).
      type: boolean
      default: false
    packing-type:
      title: PackingType
      x-tags:
      - Enums
      description: '- not_packed: Your product is not protected by any kind of bubble warp or cardboard.

        - wood_crated: Your product is fully covered in bubble warp and fragile corners are covered with cardboard. Also,
        you placed adapted protections inside the wooden crate to prevent your product from moving too much and to protect
        it even further. Last but not least, the wood crate is put on pallet.'
      type: string
      enum:
      - not_packed
      - wood_crated
    desired-packing:
      title: DesiredPacking
      x-tags:
      - Enums
      description: 'Leave empty by default.

