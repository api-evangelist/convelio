  /.well-known/* path, but with the Angular single-page-app HTML shell, not a document —
  these are SPA catch-alls and are recorded as false positives, not as hits. No
  security.txt, no api-catalog, no OpenID/OAuth metadata, no ai-plugin, no agent card.
